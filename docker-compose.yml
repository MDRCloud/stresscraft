services:

  # ── Ktor backend ───────────────────────────────────────────────
  stresscraft-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stresscraft-backend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - stresscraft-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 3

  # ── Nginx frontend / reverse proxy ────────────────────────────
  stresscraft-frontend:
    image: nginx:1.27-alpine
    container_name: stresscraft-frontend
    restart: unless-stopped
    ports:
      - "8282:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      stresscraft-backend:
        condition: service_healthy
    networks:
      - stresscraft-net

networks:
  stresscraft-net:
    driver: bridge
